# RIA Advisory — i-finsights Docker Stack
# ─────────────────────────────────────────
# Frontend : http://localhost:4000   (Nginx SPA + /api proxy)
# Backend  : http://localhost:8080   (FastAPI direct access)
# DB       : host Mac PostgreSQL via host.docker.internal
#
# Usage:
#   docker compose up -d          # start
#   docker compose down           # stop
#   docker compose logs -f        # stream logs
#   docker compose build          # rebuild both images

services:

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./03_Backend
      dockerfile: Dockerfile
    image: ria-advisory/api:latest
    container_name: ria-advisory-api
    restart: unless-stopped
    networks:
      - ria-net

    ports:
      - "8080:8000"   # host:container (8000 taken by Docker Desktop on Mac)

    environment:
      # PostgreSQL — host Mac postgres (no password on local dev)
      PGHOST:     host.docker.internal
      PGPORT:     5432
      PGDATABASE: ria_advisory
      PGUSER:     yogesh.dandawate
      PGPASSWORD: ${PGPASSWORD:-}

      # JWT
      JWT_SECRET:         ${JWT_SECRET:-ria-advisory-dev-secret-change-in-production-2026}
      JWT_ALGORITHM:      HS256
      JWT_EXPIRE_MINUTES: 60
      JWT_REFRESH_DAYS:   7

      # CORS
      ALLOWED_ORIGINS: >-
        http://localhost,
        http://localhost:4000,
        http://localhost:8080,
        http://127.0.0.1,
        https://i-finsights.netlify.app

    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux compat; no-op on Mac

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout:  5s
      retries:  5
      start_period: 10s

  # ── Nginx + React Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./02_Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""    # empty → browser hits /api/* → Nginx proxies to backend
    image: ria-advisory/web:latest
    container_name: ria-advisory-web
    restart: unless-stopped
    networks:
      - ria-net

    ports:
      - "4000:80"

    depends_on:
      backend:
        condition: service_healthy

  # ── pgAdmin ───────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ria-advisory-pgadmin
    restart: unless-stopped
    networks:
      - ria-net
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@ria-advisory.com
      PGADMIN_DEFAULT_PASSWORD: Admin@2026
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    extra_hosts:
      - "host.docker.internal:host-gateway"

# ── Shared network ─────────────────────────────────────────────────────────
networks:
  ria-net:
    name: ria-advisory-network
    driver: bridge

# ── Named volumes ───────────────────────────────────────────────────────────
volumes:
  pgadmin-data:
