# i-finsights — Casbin RBAC with Domains model
# Domain = tenant_id (UUID). Enables per-tenant policy isolation.
# sub = role string, dom = tenant_id, obj = API path, act = HTTP method

[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p_eft == allow))

[matchers]
m = (g(r.sub, p.sub, r.dom) || g(r.sub, p.sub, "*")) && (r.dom == p.dom || p.dom == "*") && keyMatch2(r.obj, p.obj) && (r.act == p.act || p.act == "*")
