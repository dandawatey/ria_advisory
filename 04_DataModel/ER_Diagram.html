<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RIA Advisory — Star Schema ER Diagram</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Segoe UI',system-ui,sans-serif; background:#0d1117; color:#c9d1d9; }

header { text-align:center; padding:22px 0 14px; border-bottom:1px solid #21262d; }
header h1 { font-size:21px; color:#58a6ff; margin-bottom:8px; letter-spacing:.3px; }
.badges { display:flex; justify-content:center; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
.badge {
  padding:3px 11px; border-radius:20px; font-size:10.5px; font-weight:600;
  border:1px solid; letter-spacing:.2px;
}
.b-gl  { color:#58a6ff; border-color:#1f6feb; background:#0d1f3c; }
.b-coa { color:#e3b341; border-color:#d29922; background:#1c1400; }
.b-ps  { color:#bc8cff; border-color:#8957e5; background:#1a0d2e; }
.b-dim { color:#3fb950; border-color:#238636; background:#0d200d; }
.b-neu { color:#8b949e; border-color:#30363d; background:#161b22; }

#canvas { overflow-x:auto; padding:24px 20px 16px; }
svg { display:block; margin:0 auto; }

/* ── TABLE STYLES ─────────────────────────── */
.fact-gl   { fill:#091d3a; stroke:#1f6feb; stroke-width:2.5; }
.fact-coa  { fill:#1a1200; stroke:#d29922; stroke-width:2.5; }
.fact-ps   { fill:#14082e; stroke:#8957e5; stroke-width:2.5; }
.dim-box   { fill:#091a09; stroke:#238636; stroke-width:1.8; }
.dim-cust  { fill:#0f1a2e; stroke:#0ea5e9; stroke-width:2; }

.hdr-gl    { fill:#1f6feb; } .hdr-coa { fill:#c59000; }
.hdr-ps    { fill:#7c3aed; } .hdr-dim { fill:#196127; }
.hdr-cust  { fill:#0369a1; }

.tname  { font-size:11.5px; font-weight:700; fill:#ffffff; }
.tsub   { font-size:8.5px;  fill:#6e7681; }
.divl   { stroke:#1e2a1e; stroke-width:1; }
.divl-f { stroke:#1a2535; stroke-width:1; }

.f    { font-size:9.5px; fill:#8b949e; }
.pk   { fill:#e3b341; font-weight:700; }
.fk   { fill:#bc8cff; }
.meas { fill:#3fb950; }
.note { font-size:8px; fill:#484f58; font-style:italic; }

/* ── CONNECTOR LINES ──────────────────────── */
.c-gl   { stroke:#1f6feb44; stroke-width:1.5; fill:none; }
.c-coa  { stroke:#d2992255; stroke-width:1.5; fill:none; }
.c-ps   { stroke:#8957e555; stroke-width:1.5; fill:none; }
.c-cust { stroke:#0ea5e966; stroke-width:1.8; fill:none; }
.c-dim  { stroke:#30363d; stroke-width:1; fill:none; }
.c-dash { stroke:#30363d99; stroke-width:1; fill:none; stroke-dasharray:5 3; }
.c-bridge { stroke:#8957e5; stroke-width:1.8; fill:none; stroke-dasharray:7 3; opacity:.6; }

.lbl      { font-size:8px; fill:#484f58; }
.lbl-cust { font-size:8px; fill:#0ea5e9; font-weight:600; }
.lbl-ps   { font-size:8px; fill:#8957e5; }

/* ── SECTION BANDS ────────────────────────── */
.section-band { fill:#ffffff06; rx:8; }
.section-lbl  { font-size:10px; fill:#30363d; font-weight:700; letter-spacing:1px; }

/* ── LEGEND ───────────────────────────────── */
.leg-bg  { fill:#161b22; stroke:#30363d; stroke-width:1; }
.lt      { font-size:9.5px; fill:#8b949e; }
</style>
</head>
<body>

<header>
  <h1>RIA Advisory Group — Star Schema ER Diagram</h1>
  <div class="badges">
    <span class="badge b-gl">fact_gl_entries · 188,380 rows</span>
    <span class="badge b-coa">fact_coa_balances · 7,892 rows</span>
    <span class="badge b-ps">fact_posted_sales · 3,094 rows</span>
    <span class="badge b-dim">13 Dimension Tables</span>
    <span class="badge b-neu">17 Companies · 8 Currencies · May 2025 – Apr 2026</span>
  </div>
  <p style="font-size:10px;color:#30363d;margin-top:4px">Source: Microsoft Business Central GL Export</p>
</header>

<div id="canvas">
<svg viewBox="0 0 2000 1320" width="2000" xmlns="http://www.w3.org/2000/svg">
