<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <!-- Outer ring — 360° complete view -->
  <circle cx="22" cy="22" r="20" stroke="#0F3F3C" stroke-width="2.5"/>
  <!-- Ascending data bars — financial growth -->
  <rect x="10"   y="27" width="5.5" height="9"  rx="1.5" fill="#0F3F3C" opacity="0.38"/>
  <rect x="19"   y="21" width="5.5" height="15" rx="1.5" fill="#0F3F3C" opacity="0.68"/>
  <rect x="28"   y="14" width="5.5" height="22" rx="1.5" fill="#0F3F3C"/>
  <!-- Upward trend line -->
  <polyline points="12.75,27 21.75,21 30.75,14"
            stroke="#1F6B66" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Coral insight dot — the "i" accent -->
  <circle cx="30.75" cy="11" r="3" fill="#E8443B"/>
</svg>
